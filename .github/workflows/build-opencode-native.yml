name: Build opencode native Android package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream v1 OpenCode version"
        required: true
        default: "1.19.5"
        type: string

permissions:
  contents: read

jobs:
  build-opencode:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate v1 version input
        run: |
          [[ "$VERSION" =~ ^1\.[0-9]+\.[0-9]+$ ]] || {
            echo "Only stable v1 versions (for example 1.19.1) are accepted: $VERSION" >&2
            exit 1
          }

      - name: Verify vendored Bionic TUI library
        run: |
          sha256sum -c assets/bionic-libopentui-0.4.5.so.sha256
          bash tools/transplant/build-libopentui.sh --check assets/bionic-libopentui-0.4.5.so

      - name: Install Android NDK r27c
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK package
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Check out Bun 1.4.4 source
        uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: bun-v1.4.4
          path: work/bun-src

      - name: Build Android Bun base without SVE
        run: |
          set -euo pipefail
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT
          LLVM_VERSION=23.1.1
          LLVM_SHA256=832aeb58d105de1cabc7b982dd2c65de0610f7377df48ae8fc2dd8e97420a15c
          LLVM_ARCHIVE="$RUNNER_TEMP/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          curl -fsSL -o "$LLVM_ARCHIVE" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          echo "$LLVM_SHA256  $LLVM_ARCHIVE" | sha256sum -c -
          LLVM_DIR="$RUNNER_TEMP/llvm-${LLVM_VERSION}"
          mkdir -p "$LLVM_DIR"
          tar -xJf "$LLVM_ARCHIVE" --strip-components=1 -C "$LLVM_DIR"
          test "$("$LLVM_DIR/bin/clang" --version | python3 -c 'import re,sys; print(re.search(r"\d+\.\d+\.\d+", sys.stdin.read()).group(0))')" = "$LLVM_VERSION"
          export BUN_TOOLCHAIN_LLVM="$LLVM_DIR"

          BUN_HOST_VERSION=1.4.4
          BUN_HOST_SHA256=e0446eb55995772eb9894bebae9a6be368d985a8b9271ee124486f9946eedd76
          curl -fsSL -o "$RUNNER_TEMP/bun-host.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_HOST_VERSION}/bun-linux-x64-baseline.zip"
          echo "$BUN_HOST_SHA256  $RUNNER_TEMP/bun-host.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun-host.zip" -d "$RUNNER_TEMP/bun-host"
          BUN_HOST="$RUNNER_TEMP/bun-host/bun-linux-x64-baseline/bun"
          test "$("$BUN_HOST" --version)" = "$BUN_HOST_VERSION"

          git -C work/bun-src submodule update --init --recursive
          python3 tools/transplant/patch_bun_no_sve.py work/bun-src
          cd work/bun-src
          "$BUN_HOST" install --frozen-lockfile
          ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            "$BUN_HOST" scripts/build.ts \
              --profile=android-release \
              --android-ndk="$ANDROID_NDK_ROOT" \
              --lto=off -j2
          test -x build/android-release/bun

          mkdir -p ../bun-cache/bun-1.4.4
          cp build/android-release/bun ../bun-cache/bun-1.4.4/bun
          chmod 755 ../bun-cache/bun-1.4.4/bun
          echo "BUN_BASE_CACHE=$GITHUB_WORKSPACE/work/bun-cache" >> "$GITHUB_ENV"
          python3 - "$GITHUB_WORKSPACE/work/bun-cache/bun-1.4.4/bun" <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path(os.environ["GITHUB_WORKSPACE"]) / "tools/transplant"))
          from probe_assemble import bun_version_from_elf
          path = Path(sys.argv[1])
          version = bun_version_from_elf(path)
          if version != "1.4.4":
              raise SystemExit(f"source-built Bun base version mismatch: {version!r}")
          print(f"source-built Android Bun base verified: {version} ({path.stat().st_size} bytes)")
          PY

      - name: Download upstream AArch64 package
        run: |
          mkdir -p work
          npm pack "opencode-linux-arm64@$VERSION" --pack-destination work
          TGZ="$(printf '%s\n' work/opencode-linux-arm64-*.tgz | head -n 1)"
          test -f "$TGZ"
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"

      - name: Transplant into Android/Bionic runtime
        run: |
          python3 tools/transplant/transplant.py all \
            --ver "$VERSION" --tgz "$TGZ" --bun-cache "$BUN_BASE_CACHE" --no-execve
          test -x "artifacts/transplant/$VERSION/opencode-native-revived"

      - name: Graft Bionic TUI library
        run: |
          python3 tools/transplant/swap_tui.py \
            --binary "artifacts/transplant/$VERSION/opencode-native-revived" \
            --tui-lib assets/bionic-libopentui-0.4.5.so \
            --out "artifacts/transplant/$VERSION/opencode-native-tui"
          test -x "artifacts/transplant/$VERSION/opencode-native-tui"

      - name: Build seccomp handler and harden v1 runtime
        run: |
          set -euo pipefail
          OUT="artifacts/transplant/$VERSION"
          BIN="$OUT/opencode-native-tui"
          test -x "$BIN"
          aarch64-linux-android31-clang -shared -fPIC -O2 \
            -o "$OUT/libopencode-crhandler.so" tools/shim/sigsys_handler.c
          python3 tools/transplant/crhandler_patch.py "$BIN"
          grep -aqF libopencode-crhandler.so "$BIN" || {
            echo "hardened ELF is missing the crhandler marker" >&2
            exit 1
          }

      - name: Strip official update channel
        run: |
          set -euo pipefail
          BIN="artifacts/transplant/$VERSION/opencode-native-tui"
          test -x "$BIN"
          python3 tools/transplant/strip_official_update.py "$BIN"
          # Second run must be a no-op (idempotency gate).
          python3 tools/transplant/strip_official_update.py "$BIN" >/dev/null
          # Every known anchor set must show the channel structurally gone.
          python3 tools/transplant/strip_official_update.py --verify "$BIN"
          # And the patched markers must be present.
          grep -aqF 'void 0?[{name:"opencode.update"' "$BIN"
          grep -aqF 'upgrade:"/global/upgradX"' "$BIN"

      - name: Package only opencode
        run: |
          ARCH_DEB=aarch64 \
          VERSION="$VERSION" \
          TRANSPLANT_ROOT="$GITHUB_WORKSPACE/artifacts/transplant" \
            bash ./scripts/package/package_deb_native.sh
          DEB="packing/dpkg-native/opencode_${VERSION}_aarch64.deb"
          dpkg-deb --field "$DEB" Package Version Architecture
          dpkg-deb --contents "$DEB" | grep 'lib/opencode/libopencode-crhandler.so'
          dpkg-deb --contents "$DEB" | grep 'bin/opencode$'
          dpkg-deb --contents "$DEB" | grep 'lib/opencode1/install.sh$'
          dpkg-deb --contents "$DEB" | grep 'bin/migrate-to-opencode1.sh$'
          dpkg-deb --ctrl-tarfile "$DEB" | tar -xO ./postinst | grep -q 'replain' \
            || { echo "postinst does not call replain" >&2; exit 1; }
          sha256sum "$DEB" | tee "$DEB.sha256"

      - name: Run transplant golden regression
        run: |
          if [[ -z "$(ls -A tests/transplant/fixtures/tgz/ 2>/dev/null)" ]]; then
            bash scripts/fetch-fixtures.sh
          fi
          python3 tests/transplant/test_golden.py --fixtures-dir tests/transplant/fixtures/tgz

      - name: Upload opencode package and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: opencode-${{ env.VERSION }}-android-aarch64
          path: |
            packing/dpkg-native/opencode_${{ env.VERSION }}_aarch64.deb
            packing/dpkg-native/opencode_${{ env.VERSION }}_aarch64.deb.sha256
            artifacts/transplant/${{ env.VERSION }}/report.json
          if-no-files-found: error
          retention-days: 14
