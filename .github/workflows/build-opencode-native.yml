name: Build opencode native Android package

# Native mainline: OpenCode v2 (2.x) transplanted from the upstream glibc Bun
# standalone into an Android/Bionic runtime, with the bionic libopentui.so
# built here (real TUI), the official update channel stripped, and the plain
# `opencode` Debian package produced.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream v2 OpenCode version"
        required: true
        default: "2.3.2"
        type: string

permissions:
  contents: read

jobs:
  build-opencode:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      ANDROID_API: "31"
      NDK_VERSION: "r30"
      BUN_VERSION: "1.4.4"
      BUN_ARCHIVE_SHA256: "d72e42c60e895ccbc16144bb1e0e0ad7ee384841c35b5501a7ec28b4d6d759c9"
      OPENTUI_PKG_SHA1: "816d3ebd1f9edbc4e44f9f617e99c3fc49b5ae33"
      CACHE_ROOT: ${{ github.workspace }}/.cache/opencode-v2
      WORK: ${{ github.workspace }}/work

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate v2 version input
        run: |
          [[ "$VERSION" =~ ^2\.[0-9]+\.[0-9]+$ ]] || {
            echo "Only stable v2 versions (for example 2.3.2) are accepted: $VERSION" >&2
            exit 1
          }

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xz-utils unzip curl python3 ca-certificates \
            binutils-aarch64-linux-gnu dpkg-dev

      - name: Restore toolchain cache (zig + NDK)
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_ROOT }}
          key: opencode-v2-zig-0.17.0-${{ env.NDK_VERSION }}-${{ hashFiles('patches/opentui/android-bionic-0.8.4.patch') }}

      - name: Fetch Android NDK ${{ env.NDK_VERSION }}
        run: |
          mkdir -p "$CACHE_ROOT/ndk"
          if [ ! -d "$CACHE_ROOT/ndk/android-ndk-$NDK_VERSION" ]; then
            curl -fsSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-$NDK_VERSION-linux.zip"
            unzip -q ndk.zip -d "$CACHE_ROOT/ndk"
            rm -f ndk.zip
          fi
          test -d "$CACHE_ROOT/ndk/android-ndk-$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

      - name: Build bionic libopentui.so (0.8.4)
        env:
          NDK_SYSROOT: ${{ env.CACHE_ROOT }}/ndk/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          WORKDIR: ${{ env.CACHE_ROOT }}/opentui-build
          STRIP_BIN: aarch64-linux-gnu-strip
        run: tools/transplant/build-libopentui-0.8.4.sh

      - name: Fetch Android Bun base ${{ env.BUN_VERSION }}
        run: |
          mkdir -p "$WORK/bun-cache/bun-$BUN_VERSION"
          ARCHIVE="$WORK/bun-android.zip"
          if [ ! -x "$WORK/bun-cache/bun-$BUN_VERSION/bun" ]; then
            curl -fsSL -o "$ARCHIVE" \
              "https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-aarch64-android.zip"
            echo "$BUN_ARCHIVE_SHA256  $ARCHIVE" | sha256sum -c -
            unzip -q -o "$ARCHIVE" -d "$WORK/bun-android"
            install -m755 "$WORK/bun-android/bun-linux-aarch64-android/bun" \
              "$WORK/bun-cache/bun-$BUN_VERSION/bun"
          fi
          test -x "$WORK/bun-cache/bun-$BUN_VERSION/bun"

      - name: Download upstream v2 package
        run: |
          mkdir -p "$WORK/pkg"
          npm pack "@opencode/cli-linux-arm64@$VERSION" --pack-destination "$WORK/pkg" >/dev/null
          TGZ="$(printf '%s\n' "$WORK"/pkg/opencode-cli-linux-arm64-*.tgz | head -n 1)"
          test -f "$TGZ"
          echo "tgz sha1: $(sha1sum "$TGZ" | cut -d' ' -f1)"
          [[ "$(sha1sum "$TGZ" | cut -d' ' -f1)" == "$OPENTUI_PKG_SHA1" ]] || {
            echo "unexpected @opencode/cli-linux-arm64 tarball digest (pinned for $VERSION)" >&2
            exit 1
          }
          tar tzf "$TGZ" | grep -qx 'package/bin/opencode'
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"

      - name: Transplant into Android/Bionic runtime
        run: |
          python3 tools/transplant/transplant.py all \
            --ver "$VERSION" --tgz "$TGZ" \
            --bun-cache "$WORK/bun-cache" --no-execve
          test -x "artifacts/transplant/$VERSION/opencode-native-revived"

      - name: Graft bionic TUI library
        run: |
          python3 tools/transplant/swap_tui.py \
            --binary "artifacts/transplant/$VERSION/opencode-native-revived" \
            --tui-lib "artifacts/transplant/opentui-0.8.4/libopentui.so" \
            --out "artifacts/transplant/$VERSION/opencode-native-tui"
          test -x "artifacts/transplant/$VERSION/opencode-native-tui"

      - name: Package opencode (v2) deb
        run: |
          set -euo pipefail
          ARCH_DEB=aarch64 \
          VERSION="$VERSION" \
          TRANSPLANT_ROOT="$GITHUB_WORKSPACE/artifacts/transplant" \
            bash ./scripts/package/package_deb_native.sh
          DEB="packing/dpkg-native/opencode_${VERSION}_aarch64.deb"
          dpkg-deb --field "$DEB" Package Version Architecture
          dpkg-deb --contents "$DEB" | grep 'bin/opencode$'
          dpkg-deb --contents "$DEB" | grep 'lib/opencode2/runtime/opencode$'
          dpkg-deb --contents "$DEB" | grep 'lib/opencode2/install.sh$'
          if dpkg-deb --contents "$DEB" | grep -q 'migrate-to-opencode1'; then
            echo "v2 package must not ship the v1 migration helper" >&2
            exit 1
          fi
          LAUNCHER_IN_DEB="$WORK/launcher.$$"
          dpkg-deb --fsys-tarfile "$DEB" | tar xO ./data/data/com.termux/files/usr/bin/opencode >"$LAUNCHER_IN_DEB"
          grep -q 'OPENCODE_DISABLE_AUTOUPDATE' "$LAUNCHER_IN_DEB"
          grep -q '_subcommand "$@"' "$LAUNCHER_IN_DEB"
          sha256sum "$DEB" | tee "$DEB.sha256"

      - name: Upload opencode package
        uses: actions/upload-artifact@v4
        with:
          name: opencode-${{ env.VERSION }}-android-aarch64
          path: |
            packing/dpkg-native/opencode_${{ env.VERSION }}_aarch64.deb
            packing/dpkg-native/opencode_${{ env.VERSION }}_aarch64.deb.sha256
            artifacts/transplant/${{ env.VERSION }}/report.json
            artifacts/transplant/opentui-0.8.4/libopentui.so.sha256
          if-no-files-found: error
          retention-days: 14
