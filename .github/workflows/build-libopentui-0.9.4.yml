name: build-libopentui-0.9.4

# Cross-builds the Android/bionic libopentui.so that opencode2 embeds
# (OpenTUI 0.9.4 native library). Runs on x86_64 CI with the Android NDK
# sysroot, so no device is needed. The produced .so is verified statically
# (DT_NEEDED, FFI guard patterns, size vs the embedded asset slot); the
# dlopen check only runs on aarch64 hosts (i.e. on device).

on:
  push:
    branches:
      - v2-opentui-0.9.4-ci
    paths:
      - "patches/opentui/android-bionic-0.9.4.patch"
      - "tools/transplant/build-libopentui-0.9.4.sh"
      - "tools/transplant/swap_tui.py"
      - ".github/workflows/build-libopentui-0.9.4.yml"
  pull_request:
    paths:
      - "patches/opentui/android-bionic-0.9.4.patch"
      - "tools/transplant/build-libopentui-0.9.4.sh"
      - "tools/transplant/swap_tui.py"
      - ".github/workflows/build-libopentui-0.9.4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_API: "31"
      NDK_VERSION: "r30"
      CACHE_ROOT: ${{ github.workspace }}/.cache/opentui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils unzip curl python3 binutils-aarch64-linux-gnu

      - name: Restore zig + NDK cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_ROOT }}
          key: opentui-094-zig-0.17.1-ndk-${{ env.NDK_VERSION }}-${{ hashFiles('patches/opentui/android-bionic-0.9.4.patch') }}

      - name: Fetch Android NDK ${{ env.NDK_VERSION }}
        run: |
          mkdir -p "$CACHE_ROOT/ndk"
          if [ ! -d "$CACHE_ROOT/ndk/android-ndk-$NDK_VERSION" ]; then
            curl -fsSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-$NDK_VERSION-linux.zip"
            unzip -q ndk.zip -d "$CACHE_ROOT/ndk"
            rm -f ndk.zip
          fi
          test -d "$CACHE_ROOT/ndk/android-ndk-$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

      - name: Build bionic libopentui.so
        env:
          NDK_SYSROOT: ${{ env.CACHE_ROOT }}/ndk/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          WORKDIR: ${{ env.CACHE_ROOT }}/build
          STRIP_BIN: aarch64-linux-gnu-strip
        run: tools/transplant/build-libopentui-0.9.4.sh

      - name: Report artifact
        run: |
          ls -l artifacts/transplant/opentui-0.9.4/
          cat artifacts/transplant/opentui-0.9.4/libopentui.so.sha256
          readelf -d artifacts/transplant/opentui-0.9.4/libopentui.so | grep NEEDED

      - name: Upload libopentui.so
        uses: actions/upload-artifact@v4
        with:
          name: libopentui-0.9.4-android-arm64
          path: artifacts/transplant/opentui-0.9.4/
          if-no-files-found: error
